  <title id="brand-title">NXLVL — horizontal lockup</title>
  <desc id="brand-desc">The NXLVL mark and wordmark locked up horizontally. Mark-to-wordmark gap is five letter gaps (187.5), half the cap height, measured ink to ink at closest approach; the wordmark's cap height is centred on the mark's height. Cap 375, stroke 100 on every stem and diagonal, letter spacing 37.5 measured edge-to-edge at closest approach. Widths N 330, X 330, L 270, V 375. Diagonals solved to exactly one stroke: N 56.29 degrees, X 60.20 degrees, V 69.86 degrees onto a 100-unit flat base. Every corner cut is 70.710678 long and lies on the angle of the edge it faces across the gap, so the two L's differ only in their top-left cut. Minimum clear space on all sides: 375 units.</desc>
