<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1568.040247 1262.5" width="1568.040247" height="1262.5" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="brand-title brand-desc">
  <title id="brand-title">NXLVL — stacked lockup</title>
  <desc id="brand-desc">The NXLVL mark centred over the wordmark, for square and portrait placements. Both elements keep the size the horizontal lockup gives them, and the air between them is the same 187.5 measured ink to ink — here the mark's lowest ink to the wordmark's cap line. Cap 375, stroke 100 on every stem and diagonal, letter spacing 37.5 measured edge-to-edge at closest approach. Widths N 330, X 330, L 270, V 375. Diagonals solved to exactly one stroke: N 56.29 degrees, X 60.20 degrees, V 69.86 degrees onto a 100-unit flat base. Every corner cut is 70.710678 long and lies on the angle of the edge it faces across the gap, so the two L's differ only in their top-left cut. Minimum clear space on all sides: 375 units.</desc>
